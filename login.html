<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Acesso ao protótipo Auto Vistoria.">
    <title>Login | Auto Vistoria</title>
    <link rel="icon" type="image/png" href="img/icon-car.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo.css">
  </head>
  <body class="login">
    <div>
      <img alt="Auto Vistoria" src="img/logologin.png" class="center-block">
      <form class="js-login-form" novalidate>
        <div class="form">
          <input id="login-cpf" type="text" autocomplete="off" inputmode="numeric" maxlength="14" required aria-describedby="login-erro">
          <label for="login-cpf" class="label-name">
            <span class="content-name">CPF</span>
          </label>
        </div>
        <p id="login-erro" class="login-erro" role="alert" hidden>Informe um CPF válido.</p>

        <button type="submit">Entrar</button>
      </form>
    </div>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
